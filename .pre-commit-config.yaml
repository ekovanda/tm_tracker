repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]

      - id: ruff-check
        name: ruff lint
        entry: ruff check
        language: system
        types: [python]

      - id: pylint
        name: pylint
        entry: "uv run --active python -m pylint"
        language: system
        types: [python]

      - id: mypy
        name: mypy
        entry: "uv run --active python -m mypy"
        language: system
        types: [python]